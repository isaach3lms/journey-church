# Render Blueprint for The Journey Church (Web Service)
# Deploy with:  Render Dashboard -> New -> Blueprint
# Or manually:  New -> Web Service, Build `npm install`, Start `npm start`
services:
  - type: web
    runtime: node
    name: journey-church
    plan: free              # change to "starter" ($7/mo) to stop cold starts
    region: ohio            # closest Render region to Missouri
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    previews:
      generation: automatic
    envVars:
      - key: NODE_VERSION
        value: "20"
